name: AeroTrack Hourly Telemetry Sweep

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas supabase

      - name: Debug Output (Show Files)
        run: |
          echo "Listing root directory:"
          ls -la
          echo "Listing dashboard directory:"
          ls -la dashboard/ || echo "Dashboard folder not found!"

      - name: Execute Dashboard Worker
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python dashboard/worker.py

      - name: Keep Streamlit Awake 
        run: |
          curl -s "https://aerotrack-v1.streamlit.app" > /dev/null
          echo "Streamlit pinged to prevent sleep."
